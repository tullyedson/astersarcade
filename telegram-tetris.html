<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<meta name="theme-color" content="#04050d"/>
<title>NEONTRIS | Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
*{box-sizing:border-box}
:root{background:#04050d;color:#eaf6ff}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#04050d}
body{
  height:var(--tg-viewport-stable-height,100dvh);
  padding:
    var(--tg-content-safe-area-inset-top,var(--tg-safe-area-inset-top,0px))
    var(--tg-content-safe-area-inset-right,var(--tg-safe-area-inset-right,0px))
    var(--tg-content-safe-area-inset-bottom,var(--tg-safe-area-inset-bottom,0px))
    var(--tg-content-safe-area-inset-left,var(--tg-safe-area-inset-left,0px));
}
#game{display:block;width:100%;height:100%;border:0;background:#04050d}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:600 16px system-ui,sans-serif}
</style>
</head>
<body>
<iframe
  id="game"
  title="Play NEONTRIS"
  src="tetris.html?telegram=1&amp;v=2"
  allow="autoplay; fullscreen"
></iframe>
<noscript><div class="fallback">NEONTRIS needs JavaScript enabled to play.</div></noscript>
<script>
(() => {
  'use strict';

  const telegram = window.Telegram?.WebApp;
  const frame = document.getElementById('game');

  if (!telegram || !telegram.initData) return;

  telegram.expand();
  telegram.setHeaderColor('#04050d');
  telegram.setBackgroundColor('#04050d');
  if (typeof telegram.setBottomBarColor === 'function') telegram.setBottomBarColor('#04050d');
  if (typeof telegram.disableVerticalSwipes === 'function') telegram.disableVerticalSwipes();

  let isReady = false;
  const ready = () => {
    if (isReady) return;
    isReady = true;
    telegram.ready();
  };
  frame.addEventListener('load', ready, { once:true });
  window.setTimeout(ready, 1500);
})();
</script>
</body>
</html>
